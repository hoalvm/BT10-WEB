<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Quản lý người dùng')}"></head>

<body>
    <div th:replace="~{layouts/layout :: page(~{::main})}">
        <main class="page-container">
            <div class="page-header">
                <h1 class="page-title">Quản lý người dùng</h1>
                <p class="page-subtitle">Danh sách tài khoản và phân quyền</p>
            </div>

            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

            <div class="toolbar">
                <form th:action="@{/users}" method="get" class="search-form">
                    <input type="text" name="keyword" th:value="${keyword}" class="search-input"
                        placeholder="Tìm theo tài khoản, email, họ tên...">
                    <input type="hidden" name="size" th:value="${size}">
                    <button type="submit" class="button">Tìm kiếm</button>
                </form>

                <a class="button" th:href="@{/users/create}">+ Thêm người dùng</a>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tài khoản</th>
                            <th>Email</th>
                            <th>Họ và tên</th>
                            <th>Vai trò</th>
                            <th>Trạng thái</th>
                            <th>Sản phẩm</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users.content}">
                            <td th:text="${u.id}"></td>
                            <td class="cell-primary" th:text="${u.username}"></td>
                            <td th:text="${u.email}"></td>
                            <td th:text="${u.fullName}"></td>
                            <td>
                                <span class="badge" th:text="${u.roleName}"></span>
                            </td>
                            <td>
                                <span th:class="${u.enabled ? 'status-tag active' : 'status-tag inactive'}"
                                    th:text="${u.enabled ? 'ACTIVE' : 'INACTIVE'}"></span>
                            </td>
                            <td class="cell-number" th:text="${u.productCount}">0</td>
                            <td class="actions">
                                <a class="action-edit" th:href="@{/users/edit/{id}(id=${u.id})}">Sửa</a>
                                <form th:action="@{/users/delete/{id}(id=${u.id})}" method="post"
                                    onsubmit="return confirm('Xác nhận xóa người dùng này?')">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="danger-link">Xóa</button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${users.empty}">
                            <td colspan="8" class="empty-state">Không có dữ liệu.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" th:if="${users.totalPages > 1}">
                <a th:if="${users.hasPrevious()}"
                    th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">«</a>

                <span th:each="i : ${#numbers.sequence(0, users.totalPages > 0 ? users.totalPages - 1 : 0)}">
                    <a th:classappend="${i == users.number ? 'active' : ''}"
                        th:href="@{/users(page=${i},size=${size},keyword=${keyword})}" th:text="${i + 1}"></a>
                </span>

                <a th:if="${users.hasNext()}"
                    th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">»</a>
            </div>
        </main>
    </div>
</body>

</html>
