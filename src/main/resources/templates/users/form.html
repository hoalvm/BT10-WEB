<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm người dùng' : 'Chỉnh sửa người dùng'})}"></head>

<body>
    <div th:replace="~{layouts/layout :: page(~{::main})}">
        <main class="page-container form-container">
            <div class="page-header">
                <h1 class="page-title" th:text="${mode == 'create' ? 'Thêm người dùng' : 'Chỉnh sửa người dùng'}">Thêm người dùng</h1>
                <p class="page-subtitle">Nhập thông tin tài khoản</p>
            </div>

            <div class="form-card">
                <form th:object="${userDTO}" method="post" accept-charset="UTF-8"
                    th:action="${mode == 'create'} ? @{/users/create} : @{/users/edit/{id}(id=${userDTO.id})}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                    <div class="alert-box alert-error" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                    </div>

                    <div class="form-group">
                        <label for="username" class="form-label">Tên đăng nhập</label>
                        <input type="text" id="username" th:field="*{username}" class="form-control"
                            th:readonly="${mode == 'edit'}" placeholder="Tên đăng nhập" required>
                        <small class="error-text" th:errors="*{username}"></small>
                    </div>

                    <div class="form-group">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" th:field="*{email}" class="form-control"
                            placeholder="name@example.com" required>
                        <small class="error-text" th:errors="*{email}"></small>
                    </div>

                    <div class="form-group">
                        <label for="fullName" class="form-label">Họ và tên</label>
                        <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                            placeholder="Họ và tên" required>
                        <small class="error-text" th:errors="*{fullName}"></small>
                    </div>

                    <div class="form-group">
                        <label for="roleName" class="form-label">Vai trò</label>
                        <select id="roleName" th:field="*{roleName}" class="form-control">
                            <option value="ROLE_USER">USER</option>
                            <option value="ROLE_ADMIN">ADMIN</option>
                        </select>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" th:field="*{enabled}"> Kích hoạt tài khoản
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button">Lưu</button>
                        <a class="button secondary" th:href="@{/users}">Hủy</a>
                    </div>
                </form>

                <p th:if="${mode == 'create'}" class="note">Mật khẩu mặc định: <strong>123456</strong>.</p>
            </div>
        </main>
    </div>
</body>

</html>
