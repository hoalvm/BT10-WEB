<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head(${mode == 'create' ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'})}"></head>

<body>
    <div th:replace="~{layouts/layout :: page(~{::main})}">
        <main class="page-container form-container">
            <div class="page-header">
                <h1 class="page-title" th:text="${mode == 'create' ? 'Thêm sản phẩm' : 'Chỉnh sửa sản phẩm'}">Thêm sản phẩm</h1>
                <p class="page-subtitle">Nhập thông tin chi tiết sản phẩm</p>
            </div>

            <div class="form-card">
                <form th:object="${productDTO}" method="post" enctype="multipart/form-data" accept-charset="UTF-8"
                    th:action="${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <input type="hidden" th:field="*{id}">

                    <div class="alert-box alert-error" th:if="${#fields.hasGlobalErrors()}">
                        <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                    </div>

                    <div class="form-group">
                        <label for="name" class="form-label">Tên sản phẩm</label>
                        <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Tên sản phẩm" required autofocus>
                        <small class="error-text" th:errors="*{name}"></small>
                    </div>

                    <div class="form-group">
                        <label for="description" class="form-label">Mô tả</label>
                        <textarea id="description" th:field="*{description}" class="form-control textarea" rows="4"
                            placeholder="Mô tả chi tiết sản phẩm"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="price" class="form-label">Đơn giá (VNĐ)</label>
                        <input type="number" id="price" step="0.01" th:field="*{price}" class="form-control"
                            placeholder="0.00" required>
                        <small class="error-text" th:errors="*{price}"></small>
                    </div>

                    <div class="form-group">
                        <label for="image" class="form-label">Hình ảnh</label>
                        <input type="file" id="image" name="image" class="form-control file-input" accept="image/*">
                    </div>

                    <div class="image-preview-group" th:if="${productDTO.imageUrl != null and !#strings.isEmpty(productDTO.imageUrl)}">
                        <label class="form-label">Ảnh hiện tại:</label>
                        <div>
                            <img th:src="${#strings.contains(productDTO.imageUrl, '|') ? #strings.substringBefore(productDTO.imageUrl, '|') : productDTO.imageUrl}"
                                class="preview" alt="Ảnh hiện tại">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="button">Lưu</button>
                        <a class="button secondary" th:href="@{/products}">Hủy</a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>

</html>
