<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <header th:fragment="header" class="site-header">
        <div class="header-container">
            <div class="header-left">
                <a th:href="@{/}" class="brand-link">PORTAL</a>
                <nav class="nav-menu">
                    <a th:href="@{/}" class="nav-item">Tổng quan</a>
                    <a th:href="@{/products}" class="nav-item">Sản phẩm</a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" class="nav-item">Người dùng</a>
                </nav>
            </div>

            <div class="header-right">
                <!-- Guest View -->
                <div class="guest-nav" sec:authorize="!isAuthenticated()">
                    <a th:href="@{/login}" class="btn-text">Đăng nhập</a>
                    <a th:href="@{/register}" class="btn-primary-sm">Đăng ký</a>
                </div>

                <!-- Authenticated View -->
                <div class="user-profile" sec:authorize="isAuthenticated()">
                    <div class="user-meta">
                        <span class="user-name" th:text="${#authentication.name}">Tài khoản</span>
                    </div>

                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn-logout" type="submit">Đăng xuất</button>
                    </form>
                </div>
            </div>
        </div>
    </header>

</body>

</html>
