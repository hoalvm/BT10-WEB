<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Đặt lại mật khẩu')}"></head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Đặt lại mật khẩu</h1>
                <p class="auth-subtitle">Nhập mã OTP và mật khẩu mới</p>
            </div>

            <!-- Alerts -->
            <div class="alert-box alert-success" th:if="${success}" th:text="${success}"></div>

            <!-- Form -->
            <form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="alert-box alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required readonly>
                    <small class="error-text" th:errors="*{email}"></small>
                </div>

                <div class="form-group">
                    <label for="otp" class="form-label">Mã OTP</label>
                    <input type="text" id="otp" name="otp" class="form-control" maxlength="6" inputmode="numeric" placeholder="6 chữ số" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu mới</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự" required>
                    <small class="error-text" th:errors="*{password}"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
                    <small class="error-text" th:errors="*{confirmPassword}"></small>
                </div>

                <button type="submit" class="btn-submit">Đổi mật khẩu</button>
            </form>

            <!-- Links -->
            <div class="auth-links">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <span>&copy; 2026 <strong>Lý Võ Mỹ Hoa</strong>. All rights reserved.</span>
            </div>
        </div>
    </div>

</body>

</html>
