<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Đăng ký')}"></head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Đăng ký</h1>
                <p class="auth-subtitle">Tạo tài khoản mới</p>
            </div>

            <!-- Form -->
            <form th:action="@{/register}" th:object="${registerDTO}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Global errors -->
                <div class="alert-box alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                </div>

                <div class="form-group">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" id="username" th:field="*{username}" class="form-control" placeholder="Tên đăng nhập" autofocus>
                    <small class="error-text" th:errors="*{username}"></small>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com">
                    <small class="error-text" th:errors="*{email}"></small>
                </div>

                <div class="form-group">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" placeholder="Họ và tên">
                    <small class="error-text" th:errors="*{fullName}"></small>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="Tối thiểu 6 ký tự">
                    <small class="error-text" th:errors="*{password}"></small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" placeholder="Nhập lại mật khẩu">
                    <small class="error-text" th:errors="*{confirmPassword}"></small>
                </div>

                <button type="submit" class="btn-submit">Đăng ký & nhận OTP</button>
            </form>

            <!-- Links -->
            <div class="auth-links">
                <a th:href="@{/login}">Đã có tài khoản? Đăng nhập</a>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <span>&copy; 2026 <strong>Lý Võ Mỹ Hoa</strong>. All rights reserved.</span>
            </div>
        </div>
    </div>

</body>

</html>
