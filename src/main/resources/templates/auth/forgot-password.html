<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Quên mật khẩu')}"></head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Quên mật khẩu</h1>
                <p class="auth-subtitle">Nhập email để nhận mã OTP khôi phục</p>
            </div>

            <!-- Form -->
            <form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <!-- Global errors -->
                <div class="alert-box alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="name@example.com" required autofocus>
                    <small class="error-text" th:errors="*{email}"></small>
                </div>

                <button type="submit" class="btn-submit">Gửi mã OTP</button>
            </form>

            <!-- Links -->
            <div class="auth-links">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <span>&copy; 2026 <strong>Lý Võ Mỹ Hoa</strong>. All rights reserved.</span>
            </div>
        </div>
    </div>

</body>

</html>
