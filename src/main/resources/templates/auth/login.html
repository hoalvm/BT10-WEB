<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Đăng nhập')}"></head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">

            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Đăng nhập</h1>
                <p class="auth-subtitle">Nhập thông tin xác thực để truy cập hệ thống</p>
            </div>

            <!-- Alerts -->
            <div class="alert-box alert-error" th:if="${param.error}">
                Tài khoản hoặc mật khẩu không chính xác.
            </div>
            <div class="alert-box alert-success" th:if="${param.logout}">
                Bạn đã đăng xuất thành công.
            </div>
            <div class="alert-box alert-success" th:if="${success}" th:text="${success}"></div>

            <!-- Form đăng nhập (Session — Bài 1-3) -->
            <form th:action="@{/login}" method="post" id="login-form" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="form-group">
                    <label for="username" class="form-label">Tài khoản</label>
                    <input type="text" id="username" name="username" class="form-control"
                           required autofocus placeholder="Tên đăng nhập hoặc email"
                           autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" name="password" class="form-control"
                           required placeholder="••••••••" autocomplete="current-password">
                </div>

                <button type="submit" id="login-btn" class="btn-submit">Đăng nhập</button>
            </form>

            <!-- Links -->
            <div class="auth-links">
                <a th:href="@{/register}">Tạo tài khoản</a>
                <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
            </div>

            <!-- Divider -->
            <div class="auth-divider">
                <span>hoặc thử JWT API</span>
            </div>

            <!-- Đăng nhập qua JWT API (Bài 4 — Stateless) -->
            <div id="api-message" class="alert-box" style="display: none;"></div>

            <div class="auth-form">
                <div class="form-group">
                    <label for="api-email" class="form-label">Email</label>
                    <input type="email" id="api-email" class="form-control"
                           placeholder="lyvomyhoa@gmail.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="api-password" class="form-label">Mật khẩu</label>
                    <input type="password" id="api-password" class="form-control"
                           placeholder="••••••••" autocomplete="new-password">
                </div>
                <button id="btn-api-login" class="btn-secondary" type="button">
                    Đăng nhập (JWT)
                </button>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <span>&copy; 2026 <strong>Lý Võ Mỹ Hoa</strong>. All rights reserved.</span>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script th:src="@{/js/auth.js}"></script>

</body>
</html>
