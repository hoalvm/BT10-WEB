<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head>

<body class="auth-body">

    <div class="auth-container">
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <h1 class="auth-title">Xác nhận OTP</h1>
                <p class="auth-subtitle">Nhập mã xác thực đã gửi qua email</p>
            </div>

            <!-- Alerts -->
            <div class="alert-box alert-success" th:if="${success}" th:text="${success}"></div>

            <!-- Form Verify OTP -->
            <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post" class="auth-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="alert-box alert-error" th:if="${#fields.hasGlobalErrors()}">
                    <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" required readonly>
                    <small class="error-text" th:errors="*{email}"></small>
                </div>

                <div class="form-group">
                    <label for="otp" class="form-label">Mã OTP</label>
                    <input type="text" id="otp" th:field="*{otp}" class="form-control" maxlength="6" inputmode="numeric" placeholder="6 chữ số" required autofocus>
                    <small class="error-text" th:errors="*{otp}"></small>
                </div>

                <button type="submit" class="btn-submit">Xác nhận</button>
            </form>

            <!-- Form Resend OTP -->
            <form th:action="@{/resend-register-otp}" method="post" class="resend-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
                <button type="submit" class="btn-secondary full-width">Gửi lại mã OTP</button>
            </form>

            <!-- Links -->
            <div class="auth-links">
                <a th:href="@{/login}">Quay lại đăng nhập</a>
            </div>

            <!-- Footer -->
            <div class="auth-footer">
                <span>&copy; 2026 <strong>Lý Võ Mỹ Hoa</strong>. All rights reserved.</span>
            </div>
        </div>
    </div>

</body>

</html>
